name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Quality Gate and build Jar
        run: ./gradlew clean check bootJar --no-daemon

      - name: Build Docker image from tested Jar
        run: >
          docker build
          --file Dockerfile.ci
          --tag serviceflow:${{ github.sha }}
          .
      
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish development Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: | 
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag serviceflow:${{ github.sha }} $IMAGE:main
          docker tag serviceflow:${{ github.sha }} $IMAGE:sha-${GITHUB_SHA::7}

          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"